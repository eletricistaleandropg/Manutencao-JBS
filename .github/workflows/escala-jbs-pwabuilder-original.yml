# Escala JBS — build DE TESTE usando o projeto ORIGINAL do PWABuilder.
# NUNCA carregar signing.keystore, signingKey.keystore ou senha neste repositorio publico.
name: Escala JBS - teste da base original PWABuilder
on:
  workflow_dispatch:
  push:
    paths:
      - 'EscalaJBS_PWABuilder_Original_CORRIGIDO_2026-11-22.zip'
      - '.github/workflows/escala-jbs-pwabuilder-original.yml'
permissions:
  contents: read
jobs:
  build-original-pwabuilder:
    runs-on: ubuntu-latest
    steps:
      - name: Ler repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Localizar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo 'Nao encontrei sdkmanager' >&2
            exit 1
          fi
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar Android 36
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER_PATH" "platforms;android-36" "build-tools;36.0.0"
      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extrair projeto ORIGINAL PWABuilder corrigido
        shell: bash
        run: |
          set -euo pipefail
          test -f EscalaJBS_PWABuilder_Original_CORRIGIDO_2026-11-22.zip
          mkdir -p original-pwabuilder
          unzip -q EscalaJBS_PWABuilder_Original_CORRIGIDO_2026-11-22.zip -d original-pwabuilder
          test -f original-pwabuilder/app/build.gradle
          test -f original-pwabuilder/app/src/main/java/io/github/eletricistaleandropg/twa/LauncherActivity.java
          test -f original-pwabuilder/app/src/main/res/drawable-mdpi/splash.png
          if find original-pwabuilder -type f \( -iname '*keystore*' -o -name 'signing-key-info.txt' \) | grep -q .; then
            echo 'ERRO: arquivo com chave privada detectado no projeto!' >&2
            exit 1
          fi
          echo 'Base original e ausencia de chaves verificadas.'
      - name: Compilar apenas APK DEBUG de teste
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p original-pwabuilder assembleDebug
          test -s original-pwabuilder/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK para teste (nao substitui app atual)
        uses: actions/upload-artifact@v4
        with:
          name: EscalaJBS-TESTE-base-ORIGINAL-PWABuilder
          path: original-pwabuilder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
