# Escala JBS — compilar em ambiente isolado; NUNCA publicar signing.keystore.
name: Escala JBS — testar e compilar Android TWA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/escala-jbs-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Ler codigo publicado do repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK preinstalado no GitHub Actions
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar associacao do site
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          host='https://eletricistaleandropg.github.io/.well-known/assetlinks.json'
          try:
              with urllib.request.urlopen(host,timeout=15) as resp:
                  data=json.load(resp)
                  print('Digital Asset Links:',resp.status,resp.headers.get('Content-Type'))
              target='io.github.eletricistaleandropg.twa'
              matches=[x for x in data if x.get('target',{}).get('package_name')==target]
              print('Pacote encontrado:',bool(matches))
              if not matches: print('AVISO: associacao Android nao encontrada no site publicado')
          except Exception as exc:
              print('AVISO: nao foi possivel consultar Digital Asset Links:',str(exc))
          PY
      - name: Preparar aplicativo TWA sem alterar site publicado
        run: |
          set -euo pipefail
          # Mudancas apenas no ambiente temporario do GitHub Actions; site publicado nao e editado.
          cat > build.gradle <<'ROOTGRADLE'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          ROOTGRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'br.com.manutencaojbs.escala'
              compileSdk 36
              defaultConfig {
                  applicationId 'io.github.eletricistaleandropg.twa'
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName '1.0.1.0'
                  resValue 'string', 'launchUrl', 'https://eletricistaleandropg.github.io/Manutencao-JBS/'
                  resValue 'string', 'hostName', 'eletricistaleandropg.github.io'
                  resValue 'string', 'providerAuthority', 'io.github.eletricistaleandropg.twa.fileprovider'
                  resValue 'string', 'fallbackType', 'customtabs'
                  resValue 'integer', 'splashScreenFadeOutDuration', '500'
                  resValue 'color', 'backgroundColor', '#081629'
              }
              buildTypes {
                  debug {
                      applicationIdSuffix '.preview'
                      resValue 'string', 'appLabel', 'Escala JBS Teste'
                  }
                  release {
                      minifyEnabled false
                      resValue 'string', 'appLabel', 'Escala JBS'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
          }
          GRADLE

          cat > app/src/main/java/br/com/manutencaojbs/escala/MainActivity.java <<'JAVA'
          package br.com.manutencaojbs.escala;

          // Trusted Web Activity: mantem atualizacoes recebidas do site.
          public class MainActivity extends com.google.androidbrowserhelper.trusted.LauncherActivity {
          }
          JAVA

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/appLabel"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true">
                  <meta-data android:name="asset_statements" android:resource="@string/assetStatements" />
                  <activity android:name=".MainActivity" android:exported="true" android:alwaysRetainTaskState="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="@string/launchUrl" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash_solid" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/backgroundColor" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="@integer/splashScreenFadeOutDuration" />
                      <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY" android:value="@string/providerAuthority" />
                      <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="@string/fallbackType" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="eletricistaleandropg.github.io" android:pathPrefix="/Manutencao-JBS/" />
                      </intent-filter>
                  </activity>
                  <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />
                  <activity android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity"
                            android:configChanges="orientation|screenSize" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="@string/providerAuthority"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/filepaths" />
                  </provider>
              </application>
          </manifest>
          MANIFEST

          mkdir -p app/src/main/res/values app/src/main/res/drawable-nodpi app/src/main/res/drawable app/src/main/res/xml
          cat > app/src/main/res/values/asset_statements.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="assetStatements" translatable="false">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://eletricistaleandropg.github.io\"}}]</string>
          </resources>
          XML
          cat > app/src/main/res/xml/filepaths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path path="twa_splash/" name="twa_splash" />
          </paths>
          XML
          cat > app/src/main/res/drawable/splash_solid.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#081629"/>
          </shape>
          XML
          # Icone do aplicativo vem do mesmo repositorio do site.
          cp icon-512.png app/src/main/res/drawable-nodpi/ic_launcher.png
          # Verificacao de integridade basica dos arquivos gerados.
          python3 - <<'PYVALID'
          import xml.etree.ElementTree as ET
          for p in ('app/src/main/AndroidManifest.xml','app/src/main/res/values/asset_statements.xml','app/src/main/res/xml/filepaths.xml','app/src/main/res/drawable/splash_solid.xml'):
              ET.parse(p)
              print('XML validado:', p)
          PYVALID
      - name: Compilar APK de teste e APK release sem assinatura
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Assinar release somente com segredos privados
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ESCALA_JBS_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ESCALA_JBS_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ESCALA_JBS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEYSTORE_BASE64}" || -z "${SIGNING_STORE_PASSWORD}" || -z "${SIGNING_KEY_PASSWORD}" ]]; then
              echo 'Chave nao configurada: release continuara sem assinatura. O APK de teste e gerado separadamente.'
              exit 0
          fi
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/escala-jbs-signing.keystore"
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-release-aligned.apk"
          "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/escala-jbs-signing.keystore" \
              --ks-key-alias 'my-key-alias' \
              --ks-pass env:SIGNING_STORE_PASSWORD \
              --key-pass env:SIGNING_KEY_PASSWORD \
              --out app/build/outputs/apk/release/Escala-JBS-1.0.1-assinado.apk \
              "$RUNNER_TEMP/app-release-aligned.apk"
          SIGN_RESULT=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/release/Escala-JBS-1.0.1-assinado.apk)
          CERT_FP=$(printf '%s' "$SIGN_RESULT" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')
          if [[ "${CERT_FP,,}" != 'b6314104c04b08b3cc840ff555ff0cc5ea09f3e0786e332db6e0be78698d4f7b' ]]; then
            echo 'ERRO: certificado nao corresponde a chave original registrada no site' >&2
            exit 1
          fi
          printf 'Assinatura SHA-256 verificada: %s
          ' "$CERT_FP"
          rm -f "$RUNNER_TEMP/escala-jbs-signing.keystore" "$RUNNER_TEMP/app-release-aligned.apk"
      - name: Disponibilizar instalador de teste
        uses: actions/upload-artifact@v4
        with:
          name: Escala-JBS-PREVIEW-nao-substitui-APK-atual
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar release assinada se configurada
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/Escala-JBS-1.0.1-assinado.apk') != '' }}
        with:
          name: Escala-JBS-RELEASE-ASSINADA
          path: app/build/outputs/apk/release/Escala-JBS-1.0.1-assinado.apk
