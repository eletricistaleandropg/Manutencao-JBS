<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183153"><title>Escala JBS — Escalas 2x2 e 12x36</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf3ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101f38,#0b1220 55%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#39d0c0;color:#08242a;font-weight:700}button.secondary{background:#25364d;color:#e5f0fa}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #39d0c0}.wrap{max-width:800px;margin:auto;padding:14px}header{background:transparent;padding:26px 0 7px}header .wrap{padding:0 16px}header h1{font-size:38px;letter-spacing:-2px;margin:0;color:#fff}header h1 span{font-size:14px!important;letter-spacing:0;font-weight:500!important;color:#a9bed1}header p{color:#89a6bb;font-size:13px;margin:3px 0}.panel{background:#17263a;border:1px solid #293d52;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls>*{flex:1}#sharePanel .controls button{font-size:13px;padding:9px 10px;border-radius:10px;line-height:1.25}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week{margin:20px 0 9px;text-align:center;font-size:11px;text-transform:uppercase;font-weight:700;color:#7994ac}.day{border:1px solid #30435a;background:#203248;border-radius:12px;min-height:84px;padding:6px 2px;text-align:center;color:#d7e5f1;cursor:pointer;transition:background .15s}.day.empty{background:transparent;border:0;cursor:default}.day.today{outline:1px dashed #59d5ca;outline-offset:1px}.day.selected{background:#214b54;border:2px solid #46e2cd;box-shadow:0 0 0 2px #163239 inset}.day.selected strong{color:#7cf5e1}.day strong{font-size:15px;display:block;margin-bottom:5px}.shift{display:block;font-size:11px;font-weight:700;padding:5px 1px;margin-top:4px;border-radius:7px;color:#15253a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.off-shift{background:#32465b!important;color:#e5eff9!important;font-size:10px!important}.muted{color:#9cb2c5;font-size:13px;line-height:1.5}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:650;display:block;margin:9px 0 5px}input,select{width:100%;padding:11px;border:1px solid #455b70;border-radius:11px;background:#22364c;color:#f2f8ff}select option{background:#22364c}.team{border-top:1px solid #30465b;padding:10px 0}.teamgrid{display:grid;grid-template-columns:1fr 75px;gap:8px;align-items:end}.teamgrid input[type=color]{height:44px;padding:4px}.hidden{display:none}.info{padding:15px;background:#203c4b;border-left:4px solid #39d0c0;border-radius:12px;margin-top:16px;font-size:14px;line-height:1.6}footer{font-size:12px;color:#8099af;text-align:center;padding:16px}h2{color:#f3f8ff;text-transform:capitalize}@media(max-width:440px){.wrap{padding:10px}.panel{padding:12px}.day{min-height:74px;padding:4px 1px}.shift{font-size:10px;padding:4px 0}.fields{grid-template-columns:1fr}header .wrap{padding:0 12px}}
@media print {
  @page { size: auto; margin: 7mm; }
  html, body { margin:0!important; padding:0!important; min-height:0!important; height:auto!important; background:white!important; color:#111!important; overflow:visible!important; }
  header { padding:0!important; margin:0 0 2mm!important; }
  header .wrap { padding:0!important; max-width:none!important; }
  header h1 { font-size:19px!important; line-height:1.15!important; letter-spacing:0!important; color:#111!important; margin:0!important; }
  header h1 span { color:#333!important; }
  main.wrap { max-width:none!important; width:100%!important; margin:0!important; padding:0!important; }
  main.wrap > .panel:not(:first-child), main.wrap > footer, #jumpPanel, #detail, #prev, #next, #today, #filter, .company-photo { display:none!important; }
  main.wrap > .panel:first-child { margin:0!important; padding:0!important; border:0!important; border-radius:0!important; box-shadow:none!important; background:white!important; color:#111!important; break-inside:avoid!important; }
  #month { display:block!important; width:100%!important; padding:2mm 0!important; margin:0!important; font-size:21px!important; line-height:1.2!important; text-align:center!important; color:#111!important; }
  .week { margin:2mm 0 1.5mm!important; color:#333!important; font-size:12px!important; }
  .days { gap:1.3mm!important; grid-auto-rows:var(--print-landscape-row,30mm)!important; }
  .day { box-sizing:border-box!important; min-height:0!important; height:var(--print-landscape-row,30mm)!important; padding:2mm 1mm!important; border:1px solid #aaa!important; border-radius:2mm!important; background:#fff!important; color:#111!important; outline:0!important; box-shadow:none!important; break-inside:avoid!important; }
  .day.empty { border:0!important; background:transparent!important; }
  .day strong { font-size:16px!important; margin-bottom:2mm!important; }
  .shift { font-size:12px!important; padding:1.6mm .5mm!important; margin-top:1.5mm!important; }
  .off-shift { font-size:11px!important; }
  .shift, .day { -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
}
@media print and (orientation: portrait) {
  .days { grid-auto-rows:var(--print-portrait-row,40mm)!important; }
  .day { height:var(--print-portrait-row,40mm)!important; }
  .day strong { font-size:17px!important; }
  .shift { font-size:clamp(8px,1.7vw,12px)!important; }
}
#month{font-size:19px!important;flex:1;min-width:0;padding:10px 5px;text-transform:capitalize;background:transparent;color:#eaf3ff;border:1px solid transparent}#month:hover{border-color:#455b70}#jumpPanel{margin-top:12px;padding:12px;background:#203248;border:1px solid #30465b;border-radius:14px}#jumpPanel .jump-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}#jumpPanel .controls{margin-top:12px}#jumpPanel label{margin-top:0}#jumpPanel input{min-width:0}

/* Aparência: preferência independente das configurações de escala. */
@media screen {
  body.theme-light{background:linear-gradient(160deg,#f2f7fb,#e9f0f7 55%);color:#23364a}
  body.theme-light header h1,body.theme-light h2{color:#172b43}
  body.theme-light header h1 span{color:#4e667e}
  body.theme-light .panel{background:#fff;border-color:#d1dce7;box-shadow:0 8px 24px #18315312}
  body.theme-light .day{background:#f1f6fa;border-color:#c8d5e2;color:#22364c}
  body.theme-light .day.empty{background:transparent;border:0}
  body.theme-light .day.selected{background:#d9f5f0;border-color:#168d80;box-shadow:0 0 0 2px #c5eae4 inset}
  body.theme-light .day.selected strong{color:#075f56}
  body.theme-light .day.today{outline-color:#168d80}
  body.theme-light .week,body.theme-light .muted{color:#526b80}
  body.theme-light .team{border-color:#d5e0ea}
  body.theme-light input,body.theme-light select{background:#f7fafc;color:#1b3046;border-color:#b7c8d8}
  body.theme-light select option{background:#fff;color:#1b3046}
  body.theme-light button.secondary{background:#e4edf5;color:#203b55}
  body.theme-light #month{color:#1b3046}
  body.theme-light #month:hover{border-color:#a5b8ca}
  body.theme-light #jumpPanel{background:#f1f6fa;border-color:#c8d5e2}
  body.theme-light .info{background:#e7f5f3;border-left-color:#15998d;color:#25475a}
  body.theme-light footer{color:#60778d}
  body.theme-light .off-shift{background:#d9e3ed!important;color:#354c61!important}
}

#detail{white-space:pre-line;overflow-wrap:anywhere}

/* Imagem na area de configuracoes */
.company-photo{display:block;width:100%;height:auto;max-height:245px;object-fit:cover;object-position:center;border-radius:14px;margin-top:17px;mask-image:linear-gradient(to bottom,#000 75%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 75%,transparent 100%)}
@media print{.company-photo{display:none!important}}

const KEY='escala2x2-exemplo2-v1';const base={mode:'2x2',start:'2026-11-16',mine:'all',entry:'06:00',exit:'18:00',names:['A','B','C','D'],colors:['#b9dcff','#d6c6ff','#bcebd2','#ffe0a8']};let config;try{config={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{config={...base}};config.mode=['2x2','12x36'].includes(config.mode)?config.mode:'2x2';config.names=config.names.map((n,i)=>n==='Turma '+String.fromCharCode(65+i)?String.fromCharCode(65+i):n);let calendarTeam=config.mine;let selectedDate=null;let view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);const $=id=>document.getElementById(id);const dayNum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);const parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const mod=(a,n)=>(a%n+n)%n;const index=d=>mod(dayNum(d)-dayNum(parse(config.start)),4);const teams=d=>config.mode==='12x36'?(mod(dayNum(d)-dayNum(parse(config.start)),2)===0?[0,1]:[2,3]):index(d)<2?[0,1]:[2,3];const exitForEntry=t=>{const [h,m]=t.split(':').map(Number);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>23||m<0||m>59)return '18:00';const total=(h*60+m+720)%1440;return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')};const format=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});function render(){ $('modeTitle').textContent=config.mode==='12x36'?'12×36':'2×2';$('month').textContent=view.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const days=$('days');days.replaceChildren();const printFirst=new Date(view.getFullYear(),view.getMonth(),1);const printTotal=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();const printRows=Math.ceil((printFirst.getDay()+printTotal)/7);days.style.setProperty('--print-landscape-row',printRows>=6?'25mm':printRows===5?'30mm':'37mm');days.style.setProperty('--print-portrait-row',printRows>=6?'39mm':printRows===5?'47mm':'59mm');const first=new Date(view.getFullYear(),view.getMonth(),1);const total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let k=0;k<first.getDay();k++){const blank=document.createElement('div');blank.className='day empty';days.append(blank)}for(let n=1;n<=total;n++){const d=new Date(view.getFullYear(),view.getMonth(),n);const cell=document.createElement('button');cell.className='day';if(dayNum(d)===dayNum(new Date()))cell.classList.add('today');if(selectedDate===d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(n).padStart(2,'0')){cell.classList.add('selected');cell.setAttribute('aria-pressed','true')}else cell.setAttribute('aria-pressed','false');const strong=document.createElement('strong');strong.textContent=n;cell.append(strong);const active=teams(d);if(calendarTeam==='all'){
active.forEach((t,j)=>{const label=document.createElement('span');label.className='shift';label.style.background=config.colors[t];label.textContent=config.names[t];cell.append(label)});
}else{
const chosen=Number(calendarTeam);
const label=document.createElement('span');label.className='shift';
if(active.includes(chosen)){label.style.background=config.colors[chosen];label.textContent=config.names[chosen];}
else{label.classList.add('off-shift');label.textContent='Folga';}
cell.append(label);
}

// Atualização: PWA usa o service worker; APK é atualizado por instalação de nova versão.
const APP_VERSION='1.7';
const updateButton=document.getElementById('checkUpdates');
const updateStatus=document.getElementById('updateStatus');
function updateMessage(message){if(updateStatus)updateStatus.textContent=message;}
if(updateButton)updateButton.addEventListener('click',async()=>{
  if(location.protocol==='file:'){
    updateMessage('Teste local: a verificação funciona após publicar no GitHub.');return;
  }
  if(!navigator.onLine){updateMessage('Sem internet. Não foi possível verificar.');return;}
  updateMessage('Verificando atualizações…');
  try{
    // Consulta diretamente o HTML publicado, ignorando cópias antigas do cache.
    const response=await fetch(new URL('./index.html?verificar='+Date.now(),location.href),{cache:'no-store'});
    if(!response.ok)throw Error('Falha ao consultar versão publicada');
    const published=await response.text();
    const match=published.match(/const APP_VERSION=['"]([^'"]+)['"]/);
    if(!match)throw Error('Versão publicada não identificada');
    if(match[1]===APP_VERSION){
      updateMessage('Você está usando a última versão.');
    }else{
      if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration('./');if(reg)await reg.update();}
      updateMessage('Nova versão disponível ('+match[1]+'). Feche e abra o aplicativo.');
    }
  }catch(e){updateMessage('Não foi possível verificar as atualizações. Tente novamente.');}
});
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
